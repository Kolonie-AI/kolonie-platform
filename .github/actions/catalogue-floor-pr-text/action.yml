# The text the squash will land, on disk, for whichever job needs to weigh a
# catalogue-floor raise against it (`#1379`, `#1545`).
#
# ## Why this is an action and not a step written twice
#
# **Two jobs read it and they are not the same job.** `check:catalogue-floor`
# runs inside `gates:built` in `build`; `apps/api/src/mcp/catalogue-budget.test.ts`
# runs inside `npm run test` in `test`. `$GITHUB_ENV` does not cross a job
# boundary, so a step in one of them exports nothing to the other.
#
# That is exactly how `#1545` happened: `#1382` put the step in `build`, `#1504`
# put a second reader in `test`, both were right on their own, and every pull
# request adding a tool was refused for saying nothing — whatever its body said.
# The defect was latent for a day because it only bites a raise, and
# `kolonie-platform#1507` was the first one after it.
#
# Twelve lines of shell duplicated across two jobs is what would let them drift
# apart again, one job at a time, with the failure landing on an author who wrote
# the sentence correctly. One definition is the property worth having, and it is
# the same argument `#1504` makes about the rule this file feeds.
#
# ## The two events, and why a merge queue needs the second branch
#
# On `pull_request` the title and body are in the event payload. In a merge group
# there is no pull request in the payload at all — only a head ref carrying the
# number — so the text is fetched. Both produce the same file, which is what lets
# a caller be indifferent to which one it is running under.
#
# ## Through a file, never through an inline expression
#
# The title is attacker-controlled. `${{ }}` interpolation of it into a `run:`
# block is a shell injection with a pull request as its vector; an `env:` binding
# and a `printf` is not.

name: Catalogue-floor pull request text
description: >-
  Write the pull request title and body the squash will land to a file, and
  export CATALOGUE_FLOOR_PR_TEXT_FILE pointing at it. A no-op on any event that
  is neither a pull request nor a merge group.

runs:
  using: composite
  steps:
    - name: Remember the text the squash will land
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        HEAD_REF: ${{ github.event.merge_group.head_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        file="$RUNNER_TEMP/catalogue-floor-pr.txt"
        if [ "$EVENT_NAME" = pull_request ]; then
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$file"
        else
          n=$(printf '%s' "$HEAD_REF" | sed -n 's/.*\/pr-\([0-9]\+\)-.*/\1/p')
          if [ -z "$n" ]; then
            echo "could not read a pull request number from HEAD_REF=$HEAD_REF"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$n" --jq '[.title, .body] | join("\n\n")' > "$file"
        fi
        echo "CATALOGUE_FLOOR_PR_TEXT_FILE=$file" >> "$GITHUB_ENV"
