      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/verifier-runner/Dockerfile
          push: true
          tags: |
            ghcr.io/kolonie-ai/kolonie-verifier-runner:latest
            ghcr.io/kolonie-ai/kolonie-verifier-runner:${{ github.sha }}
          # The same sha the label carries, reaching the process as well as the
          # image metadata (`#715`): the label answers *what is this container*
          # from the host, and this answers it from inside, so a verdict can name
          # the build that decided it.
          build-args: |
            KOLONIE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.changes.outputs.built-at }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-moderation-runner:
    name: build and push ghcr.io/kolonie-ai/kolonie-moderation-runner
    needs: changes
    if: needs.changes.outputs.moderation-runner == 'true'
    runs-on: ubuntu-latest
