name: Build api image

# Path-filtered on purpose. The api and the verifier-runner ship as separate
# images from one repository, so a change to a verifier module must not force a
# deployment of the public API. This is what buys independent deploy cadence
# without paying for a second repository — see
# kolonie-docs/onboarding/academy-levels.md.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/core/**'
      # The image ships packages/db, and the deploy migrates the live database
      # out of it. A new migration that does not rebuild this image is a
      # migration the deploy will never apply — see kolonie-infra#9.
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push ghcr.io/kolonie-ai/kolonie-api
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/kolonie-ai/kolonie-api:latest
            ghcr.io/kolonie-ai/kolonie-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The step that used to be missing (kolonie-infra#14). Pushing the image was
  # the end of this workflow, and the deploy lived on a `push` trigger in
  # kolonie-infra — so production redeployed when the infrastructure
  # configuration changed and did not redeploy when this code did. The trigger
  # was on the wrong repository.
  #
  # `version: github.sha` is the other half. Deploying `latest` would ship
  # whatever finished building most recently, which need not be this commit;
  # naming the tag this job just pushed makes what runs a function of a commit
  # again.
  deploy:
    name: deploy ghcr.io/kolonie-ai/kolonie-api:${{ github.sha }} to the VPS
    needs: build
    uses: Kolonie-AI/kolonie-infra/.github/workflows/deploy.yml@main
    with:
      service: api
      version: ${{ github.sha }}
    # Named, not inherited: the called workflow declares exactly these two, and
    # they are organisation secrets visible to this repository since #14.
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    permissions:
      contents: read
      packages: read
