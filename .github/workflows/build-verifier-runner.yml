name: Build verifier-runner image

# See build-api.yml for why these workflows are path-filtered. A new verifier
# under packages/verifiers/ deploys this image alone; the public API keeps
# serving.
on:
  push:
    branches: [main]
    paths:
      - 'apps/verifier-runner/**'
      - 'packages/verifiers/**'
      - 'packages/core/**'
      # The loop reads and writes submissions through packages/db, so a schema
      # change has to rebuild the image that reads the schema. Leaving this out
      # would mean a migration deploying while the runner still ran against the
      # shape before it.
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/build-verifier-runner.yml'
  workflow_dispatch:

concurrency:
  group: build-verifier-runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push ghcr.io/kolonie-ai/kolonie-verifier-runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/verifier-runner/Dockerfile
          push: true
          tags: |
            ghcr.io/kolonie-ai/kolonie-verifier-runner:latest
            ghcr.io/kolonie-ai/kolonie-verifier-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
