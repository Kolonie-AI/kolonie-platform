name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes the previous run irrelevant — on a pull request branch, and
# not on `main`.
#
# On a branch, only the tip matters: nobody deploys an intermediate commit and
# nobody reads its verdict, so cancelling the superseded run is free.
#
# **On `main` every commit is one that was pushed, and `main` is what deploys.**
# Cancelling there does not discard a stale answer, it discards the *only* answer
# that commit will ever get: pushes here bypass the required status check (D-053),
# so this run is not a second opinion — it is the verdict, arriving after the
# fact. A commit whose run is cancelled is on the branch that ships, unverified,
# forever.
#
# **Measured 2026-08-02, on the day this was noticed.** Of the last sixty runs on
# `main`, two were cancelled and both commits are still ancestors of `main`:
# `98a4687` (#212) and `0e70dc2`. The first was superseded minutes later during a
# session that pushed ten times, and nobody noticed — because a cancelled run is
# grey, and grey beside green reads as *unimportant* rather than as *unchecked*.
# `build-and-deploy.yml` records the same misreading one level down, where an
# evicted deploy made the Actions list say a build had been cancelled when the
# build had in fact succeeded.
#
# This makes the file agree with the rest of the project rather than introducing
# a new rule: `deploy.yml` and `health-watch.yml` in `kolonie-infra` both set
# `cancel-in-progress: false` with their reasoning written out, and
# `build-and-deploy.yml` beside this file has no workflow-level concurrency at
# all, *"a decision rather than an omission"*. This line was the last one still
# carrying the default, under a comment written before any of that was learned.
#
# **What is still exposed, stated rather than implied.** GitHub allows one
# pending run per concurrency group, so three pushes to `main` inside one run's
# duration still evict the middle waiter — the same narrower window
# `build-and-deploy.yml` names, and the same answer: it needs a burst rather than
# an ordinary sequence, and the complete fix is a check that the host matches
# `origin/main`, which is a different mechanism and belongs in `kolonie-infra`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: format, lint, build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The database the integration tests in packages/db run against.
    #
    # Pinned to the major version that runs in production. A suite that is green
    # against a different major tests a system nobody operates — see D-009 in
    # docs/decisions.md and operations/testing.md in kolonie-docs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Not a secret: this database exists for the length of one job, is
          # reachable only from inside it, and holds nothing but test rows.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kolonie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The only thing the tests know about the database. How it got here is not
      # their business: locally this points at Compose or an installed server,
      # here at the service container above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kolonie_test
      # Salts ban marks. `packages/db` refuses to start without it, so the socket
      # check below cannot start the API without one either.
      #
      # **A literal that says what it is, not a repository secret and not
      # something that looks random.** A secret would imply this value means
      # something, and a random-looking hex string is the shape AGENTS.md §3
      # forbids on sight — a reader would have to stop and work out whether it
      # is real. Nothing in CI writes a ban mark and the database goes away with
      # the runner, so the only requirement is that the API can start.
      #
      # It landed as a hard requirement on 2026-07-30 and reached neither this
      # file nor `kolonie-infra`, so CI was red and every deploy rolled back for
      # twelve hours while twelve commits were pushed past it. The incident is in
      # `operations/incidents.md` in kolonie-docs.
      BAN_MARK_SALT: ci-not-a-secret-nothing-here-writes-a-ban-mark
      # Seals the secret half of a deposit address. `apps/api` refuses to start
      # without at least 32 characters of it, so — exactly like the salt above —
      # the socket check cannot start the API without one.
      #
      # **This is the same incident twice**, and the paragraph above is the first
      # telling. On 2026-08-03 `#219` made this mandatory and it reached neither
      # this file nor anything that would have caught the omission, so `main` was
      # red from `14282fd` and stayed red through every commit pushed past it
      # (`kolonie-platform#250`). The deploy stayed green throughout, because
      # `kolonie-infra` does provide the value — which is what kept it quiet.
      #
      # A literal that says what it is, for the reason given above: nothing in CI
      # funds a deposit address, the database goes away with the runner, and the
      # only requirement is that the process can boot. It is padded past 32
      # characters deliberately — a shorter one is refused, and a reader should
      # not have to count.
      DEPOSIT_SEALING_KEY: ci-not-a-secret-no-deposit-address-here-is-ever-funded

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The service container above cannot be given command arguments — `services:`
      # takes an image, environment and a health check, and nothing else — so the
      # three durability settings are applied to it once it is up (#283). They are
      # worth roughly half the wall clock of packages/db, which was 90% of the
      # suite when measured.
      #
      # This step fails the job if the settings do not take. That is deliberate and
      # it is the whole reason it is a step rather than a line in another script: a
      # server that quietly stayed at full durability produces a *slow green run*,
      # and nothing downstream can tell that from a fast one.
      - name: Relax the test database's durability
        run: npm run test:db:relax

      # Deliberately the same single command contributors run locally, so a
      # green local run means a green CI run. See AGENTS.md §9.
      #
      # Note that this cannot silently skip the database tests: with CI set and
      # DATABASE_URL missing, packages/db fails the run rather than reporting
      # green over a suite that covered nothing.
      #
      # `CI` is also what turns off the lint and format caches (#304). A runner
      # installs from scratch, so its cache is cold whatever it does — and this is
      # the one run whose answer nobody re-checks, which makes it the wrong place
      # to hold a cache at all. The same variable GitHub sets for every step is
      # what decides it, so there is nothing here to keep in sync.
      - name: Check
        run: npm run check

      - name: Verify the domain model can be imported from its build output
        run: |
          node --input-type=module -e "
          import('./packages/core/dist/index.js').then(m => {
            if (typeof m.AgentSchema?.parse !== 'function') {
              throw new Error('packages/core does not export a usable AgentSchema')
            }
            if (m.API_BASE_PATH !== '/v1') {
              throw new Error('API_BASE_PATH is not /v1')
            }
            console.log('core build ok')
          })"

      # The unit tests drive the app through inject(); this proves the built
      # artefact actually binds a port and answers, which is what Docker checks.
      - name: Verify the API answers over a real socket
        run: |
          node apps/api/dist/server.js &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:3000/v1 | grep -q '"v1"'
