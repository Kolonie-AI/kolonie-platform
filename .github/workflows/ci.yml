name: CI

on:
  push:
    branches: [main]
  # **No `branches:` filter here, and that is the fix for `#971`.** The filter is
  # matched against the pull request's *base*, so a pull request stacked on
  # another work branch — the shape a package of dependent issues always takes —
  # matched nothing and received **no CI run at all**. Not a failing run: zero
  # check-runs on the head commit, which the pull request page renders as
  # `BLOCKED` and reads as *waiting for a check* rather than as *there is no
  # check*. An agent waiting for green waits forever.
  #
  # Observed 2026-08-14 while landing `#957`/`#958`/`#959`/`#961`: the sweep
  # merges on green rather than in order, so `#967` landed before `#966` and left
  # `#968` pointing at a branch that no longer existed. A force-push to `#968`
  # triggered nothing, and the only way out was closing and reopening it by hand.
  #
  # The filter was buying nothing: every pull request in this repository targets
  # a branch in this repository, and there is no second long-lived base whose
  # builds we would want to skip. What it cost was the one case where CI matters
  # most — a change that is about to be merged into another change.
  #
  # A stacked pull request whose base has been *deleted* has no merge ref to
  # check out, so the run fails at checkout instead of not existing. That is the
  # intended outcome and not a regression: `stacked-pr-base.yml` repoints those
  # within seconds of the merge, and a red check that names the reason is worth
  # more than a silence nobody can diagnose.
  pull_request:
  # **The only gate here that could not be started by hand, until `#1171`.** Both
  # triggers above wait on an event, and the failure this answers is the one where
  # the event never produces a run: on 2026-08-06 pushes landed and *zero
  # check-runs were created for them*. That is not a red run to re-run — there is
  # nothing to re-run, and GitHub does not offer "Re-run jobs" for a run that does
  # not exist. `workflow_dispatch` kept working throughout, which is how
  # `build-and-deploy.yml` stayed reachable that day; this file had none, so a CI
  # verdict was simply unobtainable for the length of the incident.
  #
  # `pr-without-ci.yml` detects that state hourly and asks its reader whether this
  # workflow is reachable at all. This is the trigger that lets them answer:
  #
  #     gh workflow run ci.yml -R Kolonie-AI/kolonie-platform --ref <branch>
  #
  # No inputs, deliberately: the trigger already carries a ref, and running the
  # job below against a chosen branch is the whole of what is wanted. Anything
  # else would be a second way to configure a check whose configuration is the
  # file it is written in.
  #
  # `ci-status.yml` watches `workflows: [CI]` on `workflow_run`, and `workflow_run`
  # fires for a dispatched run exactly as for an evented one — so a manual run
  # labels linked issues the same way a push does. Confirmed rather than assumed,
  # because a status label that silently stopped following manual runs would be a
  # worse failure than the one this fixes.
  # **The merge queue's own check, and the queue cannot be turned on without it.**
  #
  # A queued pull request is built onto a `refs/heads/gh-readonly-queue/…` ref
  # and GitHub waits for the *required* context on that ref. This workflow is the
  # only thing that produces `format, lint, build, typecheck, test`, so without
  # this trigger every entry would sit until it timed out and be dequeued —
  # merging would stop, quietly, on a repository whose checks all look green.
  #
  # It is the trigger that makes the queue answer `#1308`: the required check
  # finally runs against the *merge result* rather than against each branch's own
  # base, which is the hole `required_status_checks.strict` narrows and a queue
  # closes.
  merge_group:
  workflow_dispatch:

# A newer push makes the previous run irrelevant — on a pull request branch, and
# not on `main`.
#
# On a branch, only the tip matters: nobody deploys an intermediate commit and
# nobody reads its verdict, so cancelling the superseded run is free.
#
# **On `main` every commit is one that was pushed, and `main` is what deploys.**
# Cancelling there does not discard a stale answer, it discards the *only* answer
# that commit will ever get: pushes here bypass the required status check (D-053),
# so this run is not a second opinion — it is the verdict, arriving after the
# fact. A commit whose run is cancelled is on the branch that ships, unverified,
# forever.
#
# **Measured 2026-08-02, on the day this was noticed.** Of the last sixty runs on
# `main`, two were cancelled and both commits are still ancestors of `main`:
# `98a4687` (#212) and `0e70dc2`. The first was superseded minutes later during a
# session that pushed ten times, and nobody noticed — because a cancelled run is
# grey, and grey beside green reads as *unimportant* rather than as *unchecked*.
# `build-and-deploy.yml` records the same misreading one level down, where an
# evicted deploy made the Actions list say a build had been cancelled when the
# build had in fact succeeded.
#
# This makes the file agree with the rest of the project rather than introducing
# a new rule: `deploy.yml` and `health-watch.yml` in `kolonie-infra` both set
# `cancel-in-progress: false` with their reasoning written out, and
# `build-and-deploy.yml` beside this file has no workflow-level concurrency at
# all, *"a decision rather than an omission"*. This line was the last one still
# carrying the default, under a comment written before any of that was learned.
#
# **What is still exposed, stated rather than implied.** GitHub allows one
# pending run per concurrency group, so three pushes to `main` inside one run's
# duration still evict the middle waiter — the same narrower window
# `build-and-deploy.yml` names, and the same answer: it needs a burst rather than
# an ordinary sequence, and the complete fix is a check that the host matches
# `origin/main`, which is a different mechanism and belongs in `kolonie-infra`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # **A queue entry is not a stale branch tip.** The test above reads *anything
  # that is not `main` may be superseded*, which is right for a pull request
  # branch and wrong for `refs/heads/gh-readonly-queue/…`: each entry is a
  # distinct merge result and its verdict is the only one it will ever get, which
  # is the argument the paragraph above makes for `main` word for word. A
  # cancelled entry is also a dequeued entry, so treating it as superseded would
  # not merely lose an answer — it would stop the queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref,
    'refs/heads/gh-readonly-queue/') }}

permissions:
  contents: read
  # The catalogue-floor check reads the pull request title and body on a
  # merge_group event (`#1379`), because that is the text the squash will land
  # and the merge_group payload does not carry it.
  pull-requests: read

# **Three jobs and a summary, rather than one job of seventeen minutes** (`#1159`).
#
# Measured across the hundred runs before the split: median 17.1 minutes, 87
# successes, 9 cancelled, 1 failure. A formatting mistake and a failing database
# test cost the same seventeen minutes to learn about, and for an agent that
# pushes to find out whether it is green that was the price of every question.
#
# The split is by *what a failure means*, not by wall clock:
#
# | job | answers | needs |
# |---|---|---|
# | `tree` | is the source as written acceptable — lock, format, lint, fixtures, changelog | nothing |
# | `build` | does it compile, and is what it compiled usable | nothing |
# | `test` | does it behave | `build` |
# | `check` | the verdict the branch protection reads | all three |
#
# `tree` and `build` start together because neither can tell the other anything:
# a formatting error does not stop a compile, and a type error does not stop a
# lint. `test` waits on `build` so a broken compile costs three minutes rather
# than seventeen.
#
# **No sharding beyond this.** At 100–200 issues a day this repository needs
# about two runners continuously against a limit of sixty; splitting the suite
# further buys wall clock nobody is waiting on and costs a failure mode nobody
# wants — a test that only fails when it lands on the same shard as another.
jobs:
  # Everything that can be decided by reading the tree, and nothing that needs a
  # compiler or a database. This is the job that answers in three minutes.
  tree:
    name: tree
    runs-on: ubuntu-latest
    # Nothing here has ever taken longer than a minute of work; the rest is
    # `npm ci`. Ten leaves room for a slow registry and still catches a hang.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First and on its own, as it is locally: a lock file that cannot install is
      # not a tree whose formatting, types or tests mean anything, and drift here
      # arriving beside five consequences of it is a diagnosis nobody can make.
      - name: Check the lock file
        run: npm run check:lock

      # format:check, lint, check:fixtures, check:changelog — concurrently, all
      # four reported even when one fails (`#1158`). `check:migrations` reads
      # `dist` and lives in `gates:built` (`#1367`). The gates are named in
      # `package.json` rather than here, so this file does not have to be edited
      # when one is added.
      - name: Tree gates
        run: npm run gates:tree

  # Does it compile, and is what it compiled usable. Keeps the database because
  # the socket check below boots the real API process, which refuses to start
  # without one (D-009).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The database the built API is booted against, and the same major that runs
    # in production — see D-009 in docs/decisions/ and operations/testing.md in
    # kolonie-docs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Not a secret: this database exists for the length of one job, is
          # reachable only from inside it, and holds nothing but test rows.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kolonie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kolonie_test
      # Salts ban marks. `packages/db` refuses to start without it, so the socket
      # check below cannot start the API without one either.
      #
      # **A literal that says what it is, not a repository secret and not
      # something that looks random.** A secret would imply this value means
      # something, and a random-looking hex string is the shape AGENTS.md §3
      # forbids on sight — a reader would have to stop and work out whether it
      # is real. Nothing in CI writes a ban mark and the database goes away with
      # the runner, so the only requirement is that the API can start.
      #
      # It landed as a hard requirement on 2026-07-30 and reached neither this
      # file nor `kolonie-infra`, so CI was red and every deploy rolled back for
      # twelve hours while twelve commits were pushed past it. The incident is in
      # `operations/incidents.md` in kolonie-docs.
      BAN_MARK_SALT: ci-not-a-secret-nothing-here-writes-a-ban-mark
      # Seals the secret half of a deposit address. `apps/api` refuses to start
      # without at least 32 characters of it, so — exactly like the salt above —
      # the socket check cannot start the API without one.
      #
      # **This is the same incident twice**, and the paragraph above is the first
      # telling. On 2026-08-03 `#219` made this mandatory and it reached neither
      # this file nor anything that would have caught the omission, so `main` was
      # red from `14282fd` and stayed red through every commit pushed past it
      # (`kolonie-platform#250`). The deploy stayed green throughout, because
      # `kolonie-infra` does provide the value — which is what kept it quiet.
      #
      # A literal that says what it is, for the reason given above: nothing in CI
      # funds a deposit address, the database goes away with the runner, and the
      # only requirement is that the process can boot. It is padded past 32
      # characters deliberately — a shorter one is refused, and a reader should
      # not have to count.
      DEPOSIT_SEALING_KEY: ci-not-a-secret-no-deposit-address-here-is-ever-funded

    steps:
      - uses: actions/checkout@v7
        with:
          # The catalogue-floor ratchet reads git history (`#1373`). Default depth
          # of 1 made `check:catalogue-floor` exit zero in every CI run — the
          # script's own header says a shallow clone reports what it could not
          # read and exits zero rather than failing a build over checkout depth.
          # That fallback is right for an export and wrong here, which is the one
          # place the ratchet was meant to hold. Full history, because the last
          # commit that touched the floor file is often not HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # **`dist/` and `*.tsbuildinfo` are cached together, and that is the whole
      # of the correctness argument here** (`#1159`).
      #
      # `tsc -b` decides what to rebuild by reading `.tsbuildinfo` and *not* by
      # looking at the outputs. Restore the state file without the files it
      # describes and the compiler skips every project, emits nothing, and exits
      # zero — a green build over an empty `dist/`, which the artefact checks
      # below would then fail with a message about the wrong thing entirely. So
      # caching the state alone, which is the narrow reading of the issue, is the
      # one arrangement that is actively unsafe. Both or neither.
      #
      # The key names every input that changes what a build *means* — the lock
      # file and every `tsconfig` — because a stale build cache is the hazard
      # `scripts/cached-lint.mjs` already writes about: *"a stale cache answers
      # green about a file it did not look at."* A change to `tsconfig.base.json`
      # therefore misses the prefix entirely and rebuilds from nothing, which is
      # the rejection case `#1159` names.
      #
      # `restore-keys` falls back within the same prefix only, so an ordinary
      # commit restores the previous commit's outputs and compiles the difference.
      # `github.sha` in the key proper means each commit saves its own entry
      # rather than racing to overwrite one.
      #
      # Paths are enumerated rather than globbed as `**/dist`, which would sweep
      # every `dist/` under `node_modules` into the archive.
      - name: Restore the incremental build
        uses: actions/cache@v6
        with:
          path: |
            packages/*/dist
            apps/*/dist
            packages/*/*.tsbuildinfo
            apps/*/*.tsbuildinfo
          key: build-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.base.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.base.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-

      - name: Build
        run: npm run build

      # The squash commit message is the pull request title and body (`#1379`).
      # `check:catalogue-floor` judges the last commit that touched the floor
      # file, which on a branch is the author's own — so a justified commit and
      # an unjustified body both go green, then `main` goes red.
      #
      # **The step is a composite action because `test` needs it too** (`#1545`),
      # and `$GITHUB_ENV` does not cross jobs. What it does and why it writes a
      # file rather than an inline expression is in the action.
      - name: Remember the text the squash will land
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./.github/actions/remember-squash-text
        with:
          token: ${{ github.token }}

      # check:dist, check:catalogue-floor, check:migrations, typecheck —
      # everything that reads `dist/` and therefore cannot run in `tree`
      # (`#1367`). Hoisted up there they would fail with a message about the
      # wrong thing entirely, on a tree that is fine.
      - name: Built gates
        run: npm run gates:built

      - name: Verify the domain model can be imported from its build output
        run: |
          node --input-type=module -e "
          import('./packages/core/dist/index.js').then(m => {
            if (typeof m.AgentSchema?.parse !== 'function') {
              throw new Error('packages/core does not export a usable AgentSchema')
            }
            if (m.API_BASE_PATH !== '/v1') {
              throw new Error('API_BASE_PATH is not /v1')
            }
            console.log('core build ok')
          })"

      # The unit tests drive the app through inject(); this proves the built
      # artefact actually binds a port and answers, which is what Docker checks.
      - name: Verify the API answers over a real socket
        run: |
          node apps/api/dist/server.js &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:3000/v1 | grep -q '"v1"'

  # Does it behave. The long one, and the only one worth waiting on.
  test:
    name: test
    runs-on: ubuntu-latest
    # **`build` is a gate and not a dependency.** Nothing here consumes `dist/`:
    # since `#1156` the `@kolonie-ai/source` export condition resolves siblings to
    # source, so the suite compiles nothing and restores no cache. What `needs`
    # buys is that a change which does not compile costs three minutes instead of
    # seventeen.
    needs: build
    # **Measured against what the suite actually takes, not rounded up from it**
    # (`#1149`). Fifteen minutes was set when the monorepo was stood up and the
    # suite ran in 1m34s (#283). It now runs in 13.3–14 minutes, so half the runs
    # on `main` were being cancelled at the ceiling with nothing wrong in them —
    # and a cancelled run reads as a red check, which stops a pull request that
    # merges on green.
    #
    # **A cap the ordinary case reaches is not a cap.** It exists so a hung job
    # does not run for six hours; one the suite touches every other run cannot
    # tell a hang from a slow runner, and the signal it was put there to give is
    # gone whichever way it lands. Twenty-five keeps the hang caught and stops
    # catching Tuesdays.
    #
    # This is the number to lower again rather than raise: `packages/db` spends
    # 237s of its 405s in setup, running every file under both projects, and the
    # honest fix is that rather than this line.
    timeout-minutes: 25

    # The database the integration tests in packages/db run against.
    #
    # Pinned to the major version that runs in production. A suite that is green
    # against a different major tests a system nobody operates — see D-009 in
    # docs/decisions/ and operations/testing.md in kolonie-docs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Not a secret: this database exists for the length of one job, is
          # reachable only from inside it, and holds nothing but test rows.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kolonie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The only thing the tests know about the database. How it got here is not
      # their business: locally this points at Compose or an installed server,
      # here at the service container above.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kolonie_test
      # Both literals are explained at length in the `build` job above, and both
      # are needed here for the same reason: `packages/db` and `apps/api` refuse
      # to start without them, so a suite missing either fails every file rather
      # than skipping quietly.
      BAN_MARK_SALT: ci-not-a-secret-nothing-here-writes-a-ban-mark
      DEPOSIT_SEALING_KEY: ci-not-a-secret-no-deposit-address-here-is-ever-funded

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # **The one thing this job needs from `build` that `needs:` does not give
      # it** (`#1159`). `packages/db/src/storage/index.ts` is written by
      # `packages/db/scripts/generate-storage-barrel.mjs` and is git-ignored
      # (`.gitignore`), so a fresh checkout does not have it — and since `#1156`
      # the suite resolves `@kolonie-ai/db` to *source*, which is exactly the file
      # that is missing. Root `build` is `npm run barrel && tsc -b`, so before the
      # split the generator ran here as a side effect of compiling.
      #
      # Measured on the first run of this split: without it,
      # `packages/db/src/index.ts` fails to import `./storage/index.js` with
      # `ERR_MODULE_NOT_FOUND` and takes `@kolonie-ai/db`, `@kolonie-ai/api` and
      # `@kolonie-ai/moderation-runner` down with it — three red workspaces whose
      # own code is fine.
      #
      # **The generator alone and not `npm run build`.** Compiling here would undo
      # the whole of `#1156`: the suite would wait on a build it does not read, and
      # `test` would be as long as `build` plus itself. This is a node script over
      # a directory listing — under a second, and it emits nothing but source.
      - name: Generate the storage barrel
        run: npm run barrel

      # The service container above cannot be given command arguments — `services:`
      # takes an image, environment and a health check, and nothing else — so the
      # three durability settings are applied to it once it is up (#283). They are
      # worth roughly half the wall clock of packages/db, which was 90% of the
      # suite when measured.
      #
      # This step fails the job if the settings do not take. That is deliberate and
      # it is the whole reason it is a step rather than a line in another script: a
      # server that quietly stayed at full durability produces a *slow green run*,
      # and nothing downstream can tell that from a fast one.
      - name: Relax the test database's durability
        run: npm run test:db:relax

      # **`catalogue-budget.test.ts` weighs a raise the way the branch gate does**
      # (`#1504`), which means it reads the pull request's own words — and it runs
      # here, in `test`, not in `build`. `$GITHUB_ENV` does not cross jobs, so
      # until `#1545` this variable was unset for the whole of the suite:
      # `pullRequestText()` returned `''`, `raiseIsJustified('')` was false, and a
      # pull request that added a tool and justified it in its body went red
      # anyway. Same action as `build` uses, for the same reason and by the same
      # name.
      - name: Remember the text the squash will land
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: ./.github/actions/remember-squash-text
        with:
          token: ${{ github.token }}

      # Note that this cannot silently skip the database tests: with CI set and
      # DATABASE_URL missing, packages/db fails the run rather than reporting
      # green over a suite that covered nothing.
      #
      # `CI` is also what turns off the lint and format caches (#304). A runner
      # installs from scratch, so its cache is cold whatever it does — and this is
      # the one run whose answer nobody re-checks, which makes it the wrong place
      # to hold a cache at all. The same variable GitHub sets for every step is
      # what decides it, so there is nothing here to keep in sync.
      - name: Test
        run: npm run test

  # **The name is the contract.** `main`'s branch protection requires a check
  # called exactly *"format, lint, build, typecheck, test"*, which is what the
  # single job that used to do all of this was called. Splitting that job without
  # something carrying the name forward would leave the protection waiting on a
  # check that no longer exists — and GitHub renders that as *pending*, which on a
  # repository whose pull requests merge on green is indistinguishable from a run
  # that has not finished. Renaming the protection instead would have the same
  # effect for the length of the change, on every open pull request at once.
  #
  # So the name moves here and the protection is not touched. Anybody renaming
  # this job is changing a setting in the repository, not a string in a file, and
  # `scripts/ci-workflow.test.ts` says so where it will be read.
  #
  # `if: always()` because a job that is skipped is not a job that passed: without
  # it, a failing `build` skips `test`, skips this, and leaves the required check
  # neither green nor red.
  check:
    name: format, lint, build, typecheck, test
    needs: [tree, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Every result is printed and not only the failing ones, so the log answers
      # *what happened* rather than *what went wrong* — the argument `#1158` makes
      # about gates, one layer up. `cancelled` and `skipped` are failures here:
      # the only question this job answers is whether all three succeeded.
      - name: Report the verdict of the three jobs
        run: |
          fail=0
          for job in "tree:${{ needs.tree.result }}" \
                     "build:${{ needs.build.result }}" \
                     "test:${{ needs.test.result }}"; do
            name=${job%%:*}
            result=${job#*:}
            echo "${name}: ${result}"
            if [ "$result" != "success" ]; then
              echo "FAILED: ${name}"
              fail=1
            fi
          done
          exit $fail
