name: MCP surface

# What a citizen pays to be told what it *could* call (`#388`).
#
# A client fetches `tools/list` at connect and holds the answer in its system
# prompt for the whole session. So this is not a payload measured once — it is
# context-window rent, charged to every citizen in every run, whether or not it
# calls a single one of the tools described.
#
# The surface went from 53 tools on 2026-08-02 (`#211`) to 96 tools and about
# 171,583 bytes on 2026-08-05, and nothing reported it. Nobody weighed 81 % in
# three days and decided it was acceptable; nobody was looking, because there was
# no number to look at.
#
# ## What it reports, and the one thing it refuses
#
# `#388` put a number in front of whoever was adding to the surface and
# deliberately stopped there, on the ground that a hard ceiling is a figure
# somebody picks and new tools have to be able to exist. That reasoning still
# holds and there is still no ceiling. What ten days of the report established is
# that a number nobody has to answer for is a number: the catalogue went from 96
# tools to 101 while this ran, and every one of those runs was green.
#
# So the `authenticated` tier — the one every citizen pays for, in every session —
# is held to a **floor** rather than a ceiling (`#1118`). The floor is the last
# committed measurement, in `apps/api/src/mcp/catalogue-budget.json`. It moves
# down freely, and up only in a commit naming the record and saying what the new
# tools are vocabulary-free for. Nobody picked it, which is the whole difference
# between a floor and a ceiling.
#
# The other two tiers are weighed and reported and nothing fails on them. Nobody
# has shown either of them growing, and a gate on a surface that is not moving is
# a gate that only ever costs somebody an afternoon.
#
# ## Why this gates when the test suite does not
#
# `catalogue-budget.test.ts` is synthetic — stubs and arithmetic on the committed
# numbers. `npm run check` runs `check:catalogue-floor` (the commit-message check)
# and not `check-catalogue-budget.mjs`. **This workflow is the only place the live
# catalogue is weighed against the floor.** What it also does that a test cannot
# is write a reduction back: on a push to `main`, a saving is committed in the
# same run that measured it (`#1118`). A pull request never writes the floor
# (`#1266`) — it is judged against its merge base instead, so a later merge cannot
# re-lower the floor underneath an open branch and retro-fail it.
#
# ## Why it runs on `main` as well as on a pull request
#
# Because `main` is pushed to directly (D-053), and a check that only ever spoke
# on pull requests would be silent for most of what changes the surface. On a
# pull request the report is a sticky comment; on a push it is the job summary,
# which is the equivalent surface for a commit that had no review page.
#
# ## Why two jobs rather than one with a second checkout
#
# The change is the whole point, and a delta needs the base measured by the same
# code path with its own `node_modules` — this is an npm workspace, so a second
# tree sharing the first's installed dependencies would be building the head's
# workspace packages and calling the answer *base*. Two ordinary checkouts are
# slower and are not subtly wrong.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The queue builds each entry onto a `gh-readonly-queue/…` ref, and a check
  # that does not run there can never be required — it would report nothing, the
  # entry would wait out `check_response_timeout_minutes` and be evicted. So a
  # workflow that is meant to gate has to answer on all three events, and this
  # one is meant to gate: the floor is judged against the message of the commit
  # that lands, and under a squash queue that message exists for the first time
  # here (issue 1379).
  merge_group:

# The tip is the only revision anybody reads a size report for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: Weigh the surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failure on one side should still leave the other's number readable —
      # a report that says "base could not be measured" is worth more than no
      # report, and `render` treats a missing baseline as a missing column.
      fail-fast: false
      matrix:
        side: [head, base]

    steps:
      - uses: actions/checkout@v7
        with:
          # For `head` this is the tip. For `base` on a pull request it is what
          # the branch would merge into — a real SHA, which `checkout` takes.
          #
          # For `base` on a push it is the tip as well, and the step below walks
          # back one commit. That indirection is not a style choice: `checkout`
          # treats `ref` as a ref *name* and builds a refspec out of it verbatim,
          # so `<sha>^` reaches git as `+refs/heads/<sha>^*` and fails with
          # `invalid refspec`. A revision expression has to be resolved by git,
          # which means after a checkout rather than in `ref`.
          ref: ${{ matrix.side == 'base' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha) || github.sha }}
          # The parent has to be in the clone for that walk back to be possible.
          fetch-depth: 2

      # A push compares against the commit before it, and only git can name that.
      - name: Step back to the revision this side weighs
        id: rev
        if: matrix.side == 'base' && github.event_name == 'push'
        run: |
          parent="$(git rev-parse --verify --quiet 'HEAD^' || true)"
          if [ -z "$parent" ]; then
            # A commit with no parent has no baseline, and that is a report with
            # one column rather than a failure — the same degradation `render`
            # already performs when this side is missing entirely. Measuring the
            # head again and labelling it `base` would be worse than measuring
            # nothing: it reports a change of zero that nobody made.
            echo "no parent commit — no baseline to weigh, so the report carries the head's number alone"
            echo "baseline=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --detach "$parent"
          echo "weighing $parent"
          echo "baseline=$parent" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # No database, no credential and no network: the measurement connects an
      # in-memory client to a server built from the suite's own dependencies.
      # `#388` requires exactly that — measuring a tier must not need a
      # long-lived secret in CI.
      - name: Measure
        if: steps.rev.outputs.baseline != 'none'
        run: node scripts/measure-mcp-surface.mjs --out ${{ matrix.side }}.json

      - uses: actions/upload-artifact@v7
        if: steps.rev.outputs.baseline != 'none'
        with:
          name: mcp-surface-${{ matrix.side }}
          path: ${{ matrix.side }}.json

  render:
    name: Report the change
    runs-on: ubuntu-latest
    needs: measure
    # `always()`, because a base that could not be measured must not swallow the
    # head's number. The report degrades to a table with no change column.
    if: always()
    timeout-minutes: 5

    permissions:
      # A lowered floor is committed back to the branch that measured it, and
      # nothing else is written. Growth is refused rather than recorded, so this
      # token can only ever make the committed catalogue smaller.
      contents: write
      # The sticky comment on a pull request.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The branch, not the merge commit a pull request builds by default:
          # a lowered floor is pushed back here, and a detached merge commit has
          # nowhere to be pushed. On a push to `main` both expressions are the
          # same ref.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/download-artifact@v8
        with:
          pattern: mcp-surface-*
          path: measurements
          merge-multiple: true

      - name: Render
        id: render
        run: |
          node -e '
            const { renderSurfaceReport } = await import("./apps/api/dist/mcp/surface-size.js")
            const { readFile, writeFile } = await import("node:fs/promises")
            const read = async (path) => { try { return JSON.parse(await readFile(path, "utf8")) } catch { return [] } }
            const report = renderSurfaceReport(
              await read("measurements/head.json"),
              await read("measurements/base.json"),
            )
            await writeFile("surface-report.md", report + "\n", "utf8")
          ' --input-type=module
          cat surface-report.md >> "$GITHUB_STEP_SUMMARY"

      # The verdict is computed before the sticky comment so the comment carries
      # it, and the step does not exit non-zero here — a failing run must still
      # leave the number where the author can read it. The fail comes after the
      # comment, from `Fail the run when the catalogue grew past its gate`.
      #
      # On a pull request the comparison is head against base (`#1266`): tools
      # stay at zero, bytes get CATALOGUE_BYTE_TOLERANCE, and nothing writes the
      # floor file. On a push to main the comparison is against the committed
      # floor, and a reduction is written for the commit step below.
      #
      # References are spelled out as words rather than written with a hash, and
      # that is the fix rather than the quoting: in a plain YAML scalar a ` #`
      # starts a comment, so `see #388.` was discarded before the shell saw it
      # and the step ran an unterminated quote. Quoting would work until the next
      # person edits the line. The character is the trap.
      # PR_TEXT is what `branchBudgetVerdict` reads for the justification the
      # failure message asks for, and this repository squash-merges, so the body
      # is what becomes the commit message on main. The gate that runs there
      # reads the same sentence.
      #
      # It goes through `env` and never through an inline expression. A pull
      # request title is attacker-controlled text and this step is a shell
      # heredoc around a node script: interpolated, a body containing a quote
      # ends the script.
      - name: Hold the authenticated tier to its floor
        id: floor
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TEXT: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
        run: |
          # On a queue entry there is no pull request in the payload, so the two
          # expressions above are empty. The commit sitting on the queue ref *is*
          # the squash, and its message is the pull request's title and body —
          # the very text the gate on main will read once it lands. Taking it
          # from git rather than from the event is what makes this run and that
          # one agree.
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            PR_TEXT="$(git log -1 --pretty=%B)"
            export PR_TEXT
          fi
          # On a push to main the squash has already happened, and its message is
          # the pull request's title and body — the same text the branch gate read.
          # This is what lets main write a justified raise itself rather than
          # asking a branch to type the number (issue 1465).
          LANDING_MESSAGE="$(git log -1 --pretty=%B)"
          export LANDING_MESSAGE
          node -e '
            const {
              mainFloorRatchet,
              branchBudgetVerdict,
            } = await import("./apps/api/dist/mcp/catalogue-budget.js")
            const { readFile, writeFile, appendFile } = await import("node:fs/promises")
            const BUDGET = "apps/api/src/mcp/catalogue-budget.json"
            const say = async (line) => {
              await appendFile(process.env.GITHUB_STEP_SUMMARY, `\n${line}\n`, "utf8")
              console.log(line)
            }
            const readTiers = async (path) => {
              try { return JSON.parse(await readFile(path, "utf8")) } catch { return null }
            }
            const authenticated = (tiers) =>
              Array.isArray(tiers) ? tiers.find((tier) => tier.tier === "authenticated") : undefined

            const headTiers = await readTiers("measurements/head.json")
            const citizen = authenticated(headTiers)
            if (citizen === undefined) {
              // The measurement is what this judges. Missing, there is nothing
              // to judge, and passing here would read as a catalogue at its
              // floor rather than as a job that did not run.
              await say("The authenticated tier was not measured, so the floor could not be checked.")
              await appendFile(process.env.GITHUB_OUTPUT, "failed=true\n", "utf8")
              process.exit(0)
            }

            // A pull request and a queue entry are both judged against a base
            // rather than against the committed floor; only a push to main
            // ratchets it. Named for what it decides rather than for the event,
            // because it is now true of two of the three.
            const judgedAgainstBase = process.env.EVENT_NAME !== "push"
            let verdict
            if (judgedAgainstBase) {
              const baseTiers = await readTiers("measurements/base.json")
              const base = authenticated(baseTiers)
              if (base === undefined) {
                await say(
                  "The merge-base authenticated tier was not measured, so the branch " +
                    "could not be weighed against it.",
                )
                await appendFile(process.env.GITHUB_OUTPUT, "failed=true\n", "utf8")
                process.exit(0)
              }
              verdict = branchBudgetVerdict(
                { tools: citizen.tools, bytes: citizen.bytes },
                { tools: base.tools, bytes: base.bytes },
                process.env.PR_TEXT,
              )
            } else {
              const budget = JSON.parse(await readFile(BUDGET, "utf8"))
              // The message of the commit that landed is the squash of the pull
              // request that earned it, so the sentence this reads is the one
              // `branchBudgetVerdict` already accepted on the branch (issue 1465).
              const landing = process.env.LANDING_MESSAGE
              const ratchet = mainFloorRatchet(
                { tools: citizen.tools, bytes: citizen.bytes },
                budget,
                landing,
              )
              verdict = { within: ratchet.outcome !== "refused", message: ratchet.message }

              if (ratchet.totals !== undefined) {
                // Keep the per-tool ceiling the measurement did not recompute —
                // this step only ratchets the two sums. The suite-driven
                // `check-catalogue-budget.mjs` is what rewrites `heaviest`.
                //
                // `raisedFor` is written on a raise and dropped by a lowering
                // (issue 1317): it says why the floor stands where it does, and a
                // measurement that came down knows nothing about the figure before it.
                await writeFile(
                  BUDGET,
                  `${JSON.stringify({
                    tools: ratchet.totals.tools,
                    bytes: ratchet.totals.bytes,
                    heaviest: budget.heaviest,
                    measuredAt: new Date().toISOString().slice(0, 10),
                    command: "node scripts/check-catalogue-budget.mjs",
                    ...(ratchet.raisedFor === undefined ? {} : { raisedFor: ratchet.raisedFor }),
                  }, null, 2)}\n`,
                  "utf8",
                )
                await appendFile(
                  process.env.GITHUB_OUTPUT,
                  `moved=${ratchet.outcome}\n`,
                  "utf8",
                )
              }
            }

            await say(verdict.message)
            await appendFile("surface-report.md", `\n${verdict.message}\n`, "utf8")
            if (!verdict.within) {
              await appendFile(process.env.GITHUB_OUTPUT, "failed=true\n", "utf8")
            }
          ' --input-type=module

      # On a push to `main` there is no comment surface, and the job summary
      # above is the report. This step is the pull-request half only.
      - name: Say it where the review is
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment that is edited, not a new one per push: a review page
          # with nine size reports on it is a page where the size report is
          # skipped. `--edit-last --create-if-none` is the whole mechanism.
          gh pr comment "$PR" --body-file surface-report.md --edit-last --create-if-none

      - name: Fail the run when the catalogue grew past its gate
        if: steps.floor.outputs.failed == 'true'
        run: |
          echo "The authenticated tier grew past its gate — see the verdict above."
          exit 1

      # Only on a push to main. A pull request never writes the floor (`#1266`):
      # writing it on a branch was how concurrent workers collided on the same
      # file and how a later merge retro-failed open ones. The fork carve-out
      # went with that branch case.
      - name: Commit the floor main measured
        if: steps.floor.outputs.moved != '' && github.event_name == 'push'
        env:
          MOVED: ${{ steps.floor.outputs.moved }}
        run: |
          git config user.name 'kolonie-surface[bot]'
          git config user.email 'kolonie-surface@users.noreply.github.com'
          git add apps/api/src/mcp/catalogue-budget.json
          # Nothing to commit is an ordinary outcome, not a failure: two runs on
          # the same branch measure the same catalogue, and the second finds the
          # floor already where it belongs.
          if git diff --cached --quiet; then
            echo "the floor is already committed at this figure"
            exit 0
          fi
          # A raise quotes the message that earned it, and that is load-bearing
          # rather than courteous: `check:catalogue-floor` judges the *last commit
          # to touch this file*, so a raise commit whose own message says nothing
          # would refuse itself on the next run, with no honest edit available to
          # clear it — the `#1317` trap. Quoting the landing message means the
          # sentence a person wrote is the sentence that check reads.
          if [ "${MOVED}" = "raised" ]; then
            git commit \
              -m 'The catalogue floor goes up to what main measured' \
              -m "Written by the MCP surface workflow. The figure is measured and was typed by nobody; the raise is justified by the commit that landed, quoted below. See issue 1465." \
              -m "$(git log -1 --pretty=%B HEAD)"
          else
            git commit \
              -m 'The catalogue floor comes down to what this branch measured' \
              -m 'Written by the MCP surface workflow. A lowering costs no sentence — a saving is bookkeeping. See issue 1118.'
          fi
          git push origin "HEAD:${{ github.ref_name }}"
