name: Red on main

# Standing detector for a red tip of `main`, however it got there (`#1280`, `#1308`).
#
# ## What this watched, and the half it did not
#
# `#1280` built this for the **direct push**: `ci.yml` goes red and nobody reads
# it, so the next agent to cut a branch inherits failing assertions that have
# nothing to do with their change. It ran `npm run check` itself on a direct push
# and filed one standing issue with the assertions quoted.
#
# `#1308` measured the other half, four times in one session on 2026-08-19. Each
# pull request was green **against its own base**; two land in either order and
# the pair is red. This workflow's merge path did not just miss that — it made it
# worse. A push that arrived through a pull request was read as *green by
# construction*: the check was skipped, and the standing issue was **closed**. So
# the one arrangement that reliably reddens `main` was the one arrangement that
# could clear the alarm.
#
# ## So it reads CI's verdict instead of re-running the check
#
# `ci.yml` already runs on every push to `main` — direct and merge alike — and
# its `check` job is the required context. Re-running `npm run check` here was a
# second twenty-five-minute pass over a commit that was already being checked,
# and it was reachable on only one of the two paths. Reading the verdict is
# cheaper, covers both, and cannot disagree with the check that actually gates.
#
# `workflow_run` is what makes the timing work: a `push` trigger fires beside CI
# and would have to poll for a conclusion twenty minutes away — which is what
# pushed the old file into assuming one.
#
# ## What it must never do
#
# **It reads.** It re-runs nothing, reverts nothing and gates nothing. A red
# `main` still blocks no merge; that is a different decision with a real cost and
# it is not this file's to take. `#1308`'s first option — `Require branches to be
# up to date before merging`, measured off on 2026-08-19 — is a repository
# setting and the maintainer's call. This is the option that can be written down.
#
# **It closes only on evidence.** `success` closes; `failure` files; anything
# else — `cancelled`, `skipped`, an Actions outage — leaves the standing issue
# exactly as it is. Silence is the correct answer to *I do not know*, and treating
# an absence of evidence as green is the defect this replaces.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Hand-start against a known CI run, so the detector can be exercised without
  # waiting for `main` to go red. Files and closes nothing.
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: >-
          Optional. Read this CI run id and print what would have been filed.
          Does not touch the standing issue.
        required: false
        type: string

# No concurrency group. On `main` every commit is one that was pushed, and this
# run is the only notification that commit will ever get — the same reasoning
# `ci.yml` uses for `cancel-in-progress: false` on `main`.

permissions:
  contents: read

jobs:
  read:
    name: read CI's verdict
    runs-on: ubuntu-latest
    # No checkout, no build, no database, no suite: this reads two API surfaces.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
      pull-requests: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # First-line marker. Matched on the first line, never anywhere in the body
      # (`#946`): an issue a person wrote *about* this watcher, quoting the marker
      # in a fence, must not be adopted.
      MARKER: '<!-- watch-finding: main-is-red -->'

    steps:
      - name: Which run is being read
        id: run
        run: |
          set -euo pipefail

          verify='${{ inputs.verify_run_id }}'
          if [[ -n "${verify}" ]]; then
            id="${verify}"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            id='${{ github.event.workflow_run.id }}'
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi

          # Asked of the API rather than taken from the event payload, so verify
          # mode and the evented path read the same fields from the same place
          # and cannot drift.
          IFS=$'\t' read -r conclusion sha < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" \
            --jq '[.conclusion // "", .head_sha // ""] | @tsv')

          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:8}" >> "$GITHUB_OUTPUT"
          echo "CI run ${id} at ${sha:0:8} concluded ${conclusion:-unknown}."

      - name: How the commit arrived
        id: arrival
        if: steps.run.outputs.sha != ''
        run: |
          set -euo pipefail
          # Asking the commit rather than the event is what makes this work for a
          # re-run and for a direct push alike (`build-and-deploy.yml`). Empty
          # means the commit is on no pull request: a direct push.
          #
          # **It changes the sentence and never the decision.** A red tip is a red
          # tip whichever way it arrived; what differs is what a reader does next,
          # and `#1308`'s whole finding is that the merge path was being treated
          # as evidence of green.
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ steps.run.outputs.sha }}/pulls" \
            --jq '[.[].number] | join(", ")' 2>/dev/null || true)

          if [[ -z "${prs}" ]]; then
            echo "how=a direct push" >> "$GITHUB_OUTPUT"
          else
            echo "how=pull request(s) ${prs}" >> "$GITHUB_OUTPUT"
          fi

          author=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ steps.run.outputs.sha }}" \
            --jq '.commit.author.name // .commit.committer.name // "unknown"' 2>/dev/null || echo unknown)
          echo "author=${author}" >> "$GITHUB_OUTPUT"

      - name: What failed
        id: fail
        if: steps.run.outputs.conclusion == 'failure'
        run: |
          set -euo pipefail
          # `--log-failed` is the failed steps only, which is the whole reason this
          # is worth quoting: a reader of the issue should be able to recognise
          # somebody else's assertion without checking anything out. `|| true`
          # because a run whose logs have expired still deserves an issue saying
          # it was red.
          # `--log-failed` leaves ANSI colour and a job/step/timestamp prefix on
          # every line. Quoted into a markdown fence they read as a corrupted
          # paste, which is the first instinct a reader of a p1 issue distrusts
          # (`#1362`). Strip the escapes always; strip the prefix only where the
          # line actually has that shape — the column layout is not a documented
          # contract, so a mismatch must leave the line alone.
          gh run view "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" \
            --log-failed 2>/dev/null \
            | sed -E 's/\x1b\[[0-9;]*[mK]//g; s/^[^\t]*\t[^\t]*\t[0-9T:.Z-]+ //' \
            > failed.log || true

          # Prefer the lines a reader can act on. The set is deliberate:
          # `FAIL <file>` names where, `AssertionError` / `expected` names what,
          # `×` catches vitest's per-test marker, and `error TS` catches the
          # typecheck — which is how half of `#1308`'s occurrences arrived.
          assertion=$(grep -aE 'FAIL |AssertionError|expected |Error: |× |error TS[0-9]+' failed.log \
            | grep -av '^npm ' | head -n 25 || true)

          if [[ -z "${assertion}" ]]; then
            assertion=$(tail -n 40 failed.log || true)
          fi
          if [[ -z "${assertion}" ]]; then
            assertion="The failing job's log could not be read — it may have expired. The run link above still has the jobs."
          fi

          printf '%s\n' "${assertion}" > assertion.txt

          # Which jobs went red, so the issue says *test* or *build* before a
          # reader opens anything.
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.run.outputs.id }}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null || true)
          echo "jobs=${jobs:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Find the standing issue
        id: standing
        if: steps.run.outputs.verify == 'false'
        run: |
          set -euo pipefail
          # Open first; a closed marker-bearing issue is found only when we need
          # to reopen. Listed and filtered on the first line rather than trusting
          # search relevance (`#946`).
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${MARKER}\" in:body" --json number,body \
            --jq "first(.[] | select(.body | startswith(\"${MARKER}\")) | .number)" || true)
          echo "open=${open}" >> "$GITHUB_OUTPUT"

          if [[ -z "${open}" ]]; then
            closed=$(gh issue list --repo "$GITHUB_REPOSITORY" --state closed \
              --search "\"${MARKER}\" in:body" --limit 20 --json number,body \
              --jq "first(.[] | select(.body | startswith(\"${MARKER}\")) | .number)" || true)
            echo "closed=${closed}" >> "$GITHUB_OUTPUT"
          else
            echo "closed=" >> "$GITHUB_OUTPUT"
          fi

      - name: File or update the standing issue on red
        if: steps.run.outputs.conclusion == 'failure' && steps.run.outputs.verify == 'false'
        run: |
          set -euo pipefail
          sha='${{ steps.run.outputs.sha }}'
          short='${{ steps.run.outputs.short }}'
          how='${{ steps.arrival.outputs.how }}'
          author='${{ steps.arrival.outputs.author }}'
          jobs='${{ steps.fail.outputs.jobs }}'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ steps.run.outputs.id }}"
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Written line by line rather than from a heredoc: a heredoc body inside
          # an indented `run:` block carries its indentation into the file and
          # puts spaces in front of the marker (`build-and-deploy.yml`).
          {
            echo "${MARKER}"
            echo "<!-- red-since: sha=${sha} at=${at} -->"
            echo
            echo "**\`main\` is red at \`${short}\`,** and it arrived by ${how}."
            echo
            echo "| Commit | Author | Failed jobs | Run |"
            echo "|---|---|---|---|"
            echo "| [\`${short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}) | ${author} | ${jobs} | [run](${run_url}) |"
            echo
            echo "**What failed, quoted so you do not have to run anything** (\`#1308\`):"
            echo
            echo '```'
            cat assertion.txt
            echo '```'
            echo
            echo "If you are here because your own branch is red on assertions you do not"
            echo "recognise, check them against the block above before diagnosing: a branch"
            echo "cut after \`${short}\` inherits every one of them."
            echo
            echo "**A pair of individually-green pull requests can do this** (\`#1308\`)."
            echo "Each is checked against its own base and nothing re-checks the merge"
            echo "result, because \`required_status_checks.strict\` is off on \`main\`. Turning"
            echo "it on — \`Require branches to be up to date before merging\` — or a merge"
            echo "queue is the setting that closes that hole, and it is the maintainer's"
            echo "to take."
            echo
            echo "This is a standing finding, not one issue per commit. A later green CI run"
            echo "on \`main\` closes it. Closing it by hand while \`main\` is still red reopens"
            echo "it on the next red run."
            echo
            echo "**Filed by a machine** (\`red-on-main.yml\`, \`#1280\`, \`#1308\`). It reads CI's"
            echo "verdict, re-runs nothing, and forbids no path."
          } > body.md

          open='${{ steps.standing.outputs.open }}'
          closed='${{ steps.standing.outputs.closed }}'

          if [[ -n "${open}" ]]; then
            # Rewrite the body — never comment on every pass (`#231`).
            gh issue edit "${open}" --repo "$GITHUB_REPOSITORY" --body-file body.md
            echo "Updated standing issue #${open}."
          elif [[ -n "${closed}" ]]; then
            # Closed by hand while the condition held — reopen, do not file a second (`#1161`).
            gh issue reopen "${closed}" --repo "$GITHUB_REPOSITORY" \
              --comment "Reopened: \`main\` is red again at \`${short}\` (${how}). The body is rewritten with the current tip."
            gh issue edit "${closed}" --repo "$GITHUB_REPOSITORY" --body-file body.md
            echo "Reopened standing issue #${closed}."
          else
            # One `--label` per literal name — `scripts/github-issue-labels.test.ts`
            # cannot read a name assembled at run time (`#687`).
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "main is red" \
              --body-file body.md \
              --label 'from:watcher' --label 'area:platform' --label 'p1')
            echo "Opened ${url}."
          fi

          {
            echo "### Red on main"
            echo
            echo "\`${short}\` (${how}) failed CI in: ${jobs}."
            echo "Standing issue updated or opened."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the standing issue on green
        if: steps.run.outputs.conclusion == 'success' && steps.run.outputs.verify == 'false'
        run: |
          set -euo pipefail
          open='${{ steps.standing.outputs.open }}'
          short='${{ steps.run.outputs.short }}'

          if [[ -z "${open}" ]]; then
            echo "Green, and no standing issue open. Nothing to do."
            exit 0
          fi

          # Comment first, close second — an issue never ends without saying what
          # ended it.
          gh issue comment "${open}" --repo "$GITHUB_REPOSITORY" \
            --body "Closed: CI is green on \`main\` at \`${short}\` (${{ steps.arrival.outputs.how }})."
          gh issue close "${open}" --repo "$GITHUB_REPOSITORY"
          echo "Closed standing issue #${open}."

          {
            echo "### Red on main"
            echo
            echo "Closed standing issue #${open}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say nothing about a verdict that is not one
        if: >-
          steps.run.outputs.verify == 'false'
          && steps.run.outputs.conclusion != 'success'
          && steps.run.outputs.conclusion != 'failure'
        run: |
          # `cancelled`, `skipped`, `timed_out`, `action_required`, an Actions
          # outage: none of these is evidence either way, and the replaced file's
          # defect was treating an absence of evidence as green. Leaving the
          # standing issue exactly as it is *is* the answer.
          echo "CI concluded '${{ steps.run.outputs.conclusion }}' — neither green nor red. The standing issue is untouched."
          {
            echo "### Red on main"
            echo
            echo "CI concluded \`${{ steps.run.outputs.conclusion }}\`. Nothing filed, nothing closed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verification result
        if: steps.run.outputs.verify == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Red on main — verification"
            echo
            echo "Read CI run \`${{ steps.run.outputs.id }}\` at \`${{ steps.run.outputs.short }}\`."
            echo "Conclusion: \`${{ steps.run.outputs.conclusion }}\`."
            echo "Failed jobs: ${{ steps.fail.outputs.jobs }}"
            echo
            echo "Nothing was filed or closed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f assertion.txt ]]; then
            echo "What would have been quoted:"
            cat assertion.txt
          fi
